        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Install macOS dependencies
        run: |
          brew install boost openssl libevent hiredis
          echo "CMAKE_PREFIX_PATH=$(brew --prefix):/usr/local:${CMAKE_PREFIX_PATH:-}" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=$(brew --prefix)/lib:/usr/local/lib:${DYLD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Clone and Install fakelua
        run: |
          git clone --depth 1 https://github.com/esrrhs/fakelua.git /tmp/fakelua
          cmake -S /tmp/fakelua -B /tmp/fakelua/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(brew --prefix)" \
