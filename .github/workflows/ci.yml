name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-24.04
    # 实测约 14m。留到 45m 是为了 fakelua 缓存失效（需现场编译 fakelua）时不误判超时。
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fakefish
          MYSQL_USER: fakefish
          MYSQL_PASSWORD: changeme
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout fakefish
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for f in web/*.js test_*.js; do node --check "$f"; done

      # 秒级门禁：双向校验 test_*.js 与 scripts/e2e-*.txt 清单一致，
      # 防止新增用例忘记登记——未登记的用例永远不会在 CI 里被执行。
      - name: Verify E2E suite coverage
        run: bash scripts/check_e2e_coverage.sh

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-fakefish
          max-size: 2G

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libssl-dev libevent-dev libhiredis-dev default-libmysqlclient-dev default-mysql-client

      - name: Initialize MySQL database schema
        run: |
          mysql -h 127.0.0.1 -u fakefish -pchangeme fakefish < sql/schema.sql

      - name: Resolve fakelua commit
        id: flua
        run: |
          git clone --depth 1 https://github.com/esrrhs/fakelua.git "$HOME/flua-src"
          echo "sha=$(git -C "$HOME/flua-src" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore cached fakelua install
        id: cache-flua
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/flua-install
          key: fakelua-${{ runner.os }}-${{ steps.flua.outputs.sha }}

      - name: Build and install fakelua
        if: steps.cache-flua.outputs.cache-hit != 'true'
        run: |
          cmake -S "$HOME/flua-src" -B "$HOME/flua-src/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/flua-install" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DFAKELUA_BUILD_TESTS=OFF \
            -DFAKELUA_BUILD_BENCHMARKS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "$HOME/flua-src/build" --target install -j$(nproc)

      - name: Export fakelua library path
        run: |
          echo "LD_LIBRARY_PATH=$HOME/flua-install/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Build fakefish
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/flua-install" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)

      - name: Prepare runtime configuration
        run: |
          cp config.example.yaml config.yaml
          # Update config.yaml with CI MySQL credentials.
          # 只替换第一处（mysql 段）：redis 段同样有 password: ""，全局替换会让
          # 无密码的 CI redis service 收到 AUTH 而拒绝连接（GNU sed 0,addr 语法）。
          sed -i '0,/user: "root"/s//user: "fakefish"/' config.yaml
          sed -i '0,/password: ""/s//password: "changeme"/' config.yaml
          # Disable bots for the deterministic client/combat phase (re-enabled before test_bots.js)
          sed -i.bak 's/bot_count: 3/bot_count: 0/' config.yaml && rm -f config.yaml.bak
          # Configure hotfix token used by test_hotfix.js
          sed -i.bak 's/hotfix_token: ""/hotfix_token: "test123"/' config.yaml && rm -f config.yaml.bak
          # Speed up the feast gold-rain cycle so test_feast.js sees one quickly
          sed -i.bak 's/feast_interval_s: 120/feast_interval_s: 12/' config.yaml && rm -f config.yaml.bak
          # Speed up the safe-zone shrink/hold cycle so test_zone.js sees a full cycle
          sed -i.bak 's/zone_shrink_interval_s: 60/zone_shrink_interval_s: 12/' config.yaml && rm -f config.yaml.bak
          sed -i.bak 's/zone_hold_s: 30/zone_hold_s: 6/' config.yaml && rm -f config.yaml.bak
          # 主阶段是 bot_count=0 的单人世界：关掉一局制，保留旧的「缩圈循环 + 被吃复活」
          # 语义，让 combat/split/zone 这类用例仍在确定性世界里跑（一局制要有人被淘汰
          # 才分得出胜负，放到下面的机器人阶段验证）
          sed -i.bak 's/match_enable: true/match_enable: false/' config.yaml && rm -f config.yaml.bak
          npm install

      - name: Run fakefish server & E2E self-test
        run: |
          ./build/fakefish --config=config.yaml > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"

          # Wait for HTTP server to become ready
          READY=0
          for i in $(seq 1 90); do
            if curl -s -f http://127.0.0.1:8080/ > /dev/null 2>&1; then
              echo "Server is ready after $i seconds!"
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "Server failed to start within 90s. Log output:"
            cat server.log
            exit 1
          fi

          # 用例清单见 scripts/e2e-main.txt（三平台共用唯一真源；scripts/check_e2e_coverage.sh 门禁防漏登）
          bash scripts/run_e2e_suite.sh scripts/e2e-main.txt

          # Kill server, restart with bots enabled for the bots/rank test
          kill $SERVER_PID || true
          sleep 1
          sed -i.bak 's/bot_count: 0/bot_count: 3/' config.yaml && rm -f config.yaml.bak
          # 机器人阶段开回一局制：有 3 个机器人当对手，才能真正打出「缩圈到 0 →
          # 最后一个存活者吃鸡 → 自动开新局」的完整流程（test_match.js）
          sed -i.bak 's/match_enable: false/match_enable: true/' config.yaml && rm -f config.yaml.bak
          # 一局调快：单局 45s + 结算 5s，让 test_match.js 在一个观察窗口内看到完整循环
          sed -i.bak 's/match_duration_s: 90/match_duration_s: 45/' config.yaml && rm -f config.yaml.bak
          ./build/fakefish --config=config.yaml > server_bots.log 2>&1 &
          SERVER_PID=$!
          BOT_READY=0
          for i in $(seq 1 60); do
            if curl -s -f http://127.0.0.1:8080/ > /dev/null 2>&1; then
              BOT_READY=1
              break
            fi
            sleep 1
          done
          if [ $BOT_READY -ne 1 ]; then
            echo "Server failed to restart within 60s. Log output:"
            cat server_bots.log
            exit 1
          fi

          # 用例清单见 scripts/e2e-bots.txt（三平台共用唯一真源；scripts/check_e2e_coverage.sh 门禁防漏登）
          bash scripts/run_e2e_suite.sh scripts/e2e-bots.txt


          # Kill server
          kill $SERVER_PID || true

      - name: Dump server log on failure
        if: failure()
        run: |
          if [ -f server.log ]; then
            echo "=== Server Output ==="
            cat server.log
          fi
          if [ -f server_bots.log ]; then
            echo "=== Bots-phase Server Output ==="
            cat server_bots.log
          fi
          if [ -f persist_child.log ]; then
            echo "=== Persistence Child Server Output ==="
            cat persist_child.log
          fi

  test-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    # 实测约 21m，原 30m 上限余量不足；macOS runner 较慢且 fakelua 缓存失效时需现场编译。
    timeout-minutes: 45

    steps:
      - name: Checkout fakefish
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for f in web/*.js test_*.js; do node --check "$f"; done

      # 秒级门禁：双向校验 test_*.js 与 scripts/e2e-*.txt 清单一致，
      # 防止新增用例忘记登记——未登记的用例永远不会在 CI 里被执行。
      - name: Verify E2E suite coverage
        run: bash scripts/check_e2e_coverage.sh

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-fakefish
          max-size: 2G

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Install macOS dependencies
        run: |
          brew install boost openssl libevent hiredis redis
          echo "CMAKE_PREFIX_PATH=$(brew --prefix):/usr/local:${CMAKE_PREFIX_PATH:-}" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=$(brew --prefix)/lib:/usr/local/lib:${DYLD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Start Redis
        run: |
          redis-server --daemonize yes
          redis-cli ping

      - name: Resolve fakelua commit
        id: flua
        run: |
          git clone --depth 1 https://github.com/esrrhs/fakelua.git "$HOME/flua-src"
          echo "sha=$(git -C "$HOME/flua-src" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore cached fakelua install
        id: cache-flua
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/flua-install
          key: fakelua-${{ runner.os }}-${{ steps.flua.outputs.sha }}

      - name: Build and install fakelua
        if: steps.cache-flua.outputs.cache-hit != 'true'
        run: |
          cmake -S "$HOME/flua-src" -B "$HOME/flua-src/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/flua-install" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DFAKELUA_BUILD_TESTS=OFF \
            -DFAKELUA_BUILD_BENCHMARKS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "$HOME/flua-src/build" --target install -j$(sysctl -n hw.logicalcpu)

      - name: Export fakelua library path
        run: |
          echo "DYLD_LIBRARY_PATH=$HOME/flua-install/lib:${DYLD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Build fakefish
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/flua-install;$(brew --prefix);/usr/local" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Prepare runtime configuration
        run: |
          cp config.example.yaml config.yaml
          # Disable bots for the deterministic client/combat phase (re-enabled before test_bots.js)
          sed -i.bak 's/bot_count: 3/bot_count: 0/' config.yaml && rm -f config.yaml.bak
          # Configure hotfix token used by test_hotfix.js
          sed -i.bak 's/hotfix_token: ""/hotfix_token: "test123"/' config.yaml && rm -f config.yaml.bak
          # Speed up the feast gold-rain cycle so test_feast.js sees one quickly
          sed -i.bak 's/feast_interval_s: 120/feast_interval_s: 12/' config.yaml && rm -f config.yaml.bak
          # Speed up the safe-zone shrink/hold cycle so test_zone.js sees a full cycle
          sed -i.bak 's/zone_shrink_interval_s: 60/zone_shrink_interval_s: 12/' config.yaml && rm -f config.yaml.bak
          sed -i.bak 's/zone_hold_s: 30/zone_hold_s: 6/' config.yaml && rm -f config.yaml.bak
          # 主阶段是 bot_count=0 的单人世界：关掉一局制，保留旧的「缩圈循环 + 被吃复活」
          # 语义，让 combat/split/zone 这类用例仍在确定性世界里跑（一局制要有人被淘汰
          # 才分得出胜负，放到下面的机器人阶段验证）
          sed -i.bak 's/match_enable: true/match_enable: false/' config.yaml && rm -f config.yaml.bak
          npm install

      - name: Run fakefish server & E2E self-test
        run: |
          ./build/fakefish --config=config.yaml > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"

          # Wait for HTTP server to become ready
          READY=0
          for i in $(seq 1 90); do
            if curl -s -f http://127.0.0.1:8080/ > /dev/null 2>&1; then
              echo "Server is ready after $i seconds!"
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "Server failed to start within 90s. Log output:"
            cat server.log
            exit 1
          fi

          # 用例清单见 scripts/e2e-main.txt（三平台共用唯一真源；scripts/check_e2e_coverage.sh 门禁防漏登）
          bash scripts/run_e2e_suite.sh scripts/e2e-main.txt

          # Kill server, restart with bots enabled for the bots/rank test
          kill $SERVER_PID || true
          sleep 1
          sed -i.bak 's/bot_count: 0/bot_count: 3/' config.yaml && rm -f config.yaml.bak
          # 机器人阶段开回一局制：有 3 个机器人当对手，才能真正打出「缩圈到 0 →
          # 最后一个存活者吃鸡 → 自动开新局」的完整流程（test_match.js）
          sed -i.bak 's/match_enable: false/match_enable: true/' config.yaml && rm -f config.yaml.bak
          # 一局调快：单局 45s + 结算 5s，让 test_match.js 在一个观察窗口内看到完整循环
          sed -i.bak 's/match_duration_s: 90/match_duration_s: 45/' config.yaml && rm -f config.yaml.bak
          ./build/fakefish --config=config.yaml > server_bots.log 2>&1 &
          SERVER_PID=$!
          BOT_READY=0
          for i in $(seq 1 60); do
            if curl -s -f http://127.0.0.1:8080/ > /dev/null 2>&1; then
              BOT_READY=1
              break
            fi
            sleep 1
          done
          if [ $BOT_READY -ne 1 ]; then
            echo "Server failed to restart within 60s. Log output:"
            cat server_bots.log
            exit 1
          fi

          # 用例清单见 scripts/e2e-bots.txt（三平台共用唯一真源；scripts/check_e2e_coverage.sh 门禁防漏登）
          bash scripts/run_e2e_suite.sh scripts/e2e-bots.txt


          # Kill server
          kill $SERVER_PID || true

      - name: Dump server log on failure
        if: failure()
        run: |
          if [ -f server.log ]; then
            echo "=== Server Output ==="
            cat server.log
          fi
          if [ -f server_bots.log ]; then
            echo "=== Bots-phase Server Output ==="
            cat server_bots.log
          fi
          if [ -f persist_child.log ]; then
            echo "=== Persistence Child Server Output ==="
            cat persist_child.log
          fi

  # Windows 与 ubuntu/macos 不同：fakelua 上游只支持 MinGW GCC 构建（CMake 里
  # 无条件使用 -fPIC/-ggdb 等 GCC 参数），所以本 job 全程在 MSYS2 MINGW64 里
  # 复刻 fakelua 官方 Windows 流水线（GCC + Ninja），与上游 build_with_windows 对齐。
  test-windows:
    name: Build & Test (Windows)
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout fakefish
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # E2E 用例依赖 ws 包（ubuntu/macos job 在构建步骤里 npm install，Windows 单独补）
      - name: Install JS dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Install MySQL
        shell: pwsh
        run: choco install mysql -y --no-progress

      - name: Start and configure MySQL
        shell: pwsh
        run: |
          $service = Get-Service | Where-Object { $_.Name -like "*MySQL*" } | Select-Object -First 1
          if ($service) {
            Write-Host "Found MySQL service: $($service.Name)"
            Start-Service $service.Name
            Start-Sleep -Seconds 10
          } else {
            net start MySQL80 2>$null
            net start MySQL 2>$null
          }
          $bins = @(
            "$env:ChocolateyInstall\bin",
            "C:\tools\mysql\current\bin"
          )
          Get-ChildItem "C:\Program Files\MySQL" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $p = Join-Path $_.FullName "bin"
            if (Test-Path (Join-Path $p "mysql.exe")) { $bins += $p }
          }
          $env:Path = ($bins + $env:Path) -join ';'
          Get-Command mysql, mysqladmin -ErrorAction Stop | ForEach-Object { Write-Host "Using $($_.Source)" }
          $ready = $false
          for ($i = 1; $i -le 30; $i++) {
            & mysqladmin -h 127.0.0.1 --protocol=tcp ping 2>$null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw "MySQL did not become ready" }
          # choco mysql 首次安装 root 多为空密码；与 fakelua 上游一致先置 root/root，
          # 再建 fakefish 业务账号（fakefish/changeme，与 Linux job 的 sed 改写对齐）。
          $rootSql = @"
          CREATE DATABASE IF NOT EXISTS test;
          CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY 'root';
          ALTER USER 'root'@'127.0.0.1' IDENTIFIED BY 'root';
          ALTER USER 'root'@'localhost' IDENTIFIED BY 'root';
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'localhost' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
          FLUSH PRIVILEGES;
          "@
          $configured = $false
          foreach ($pwd in @('', 'root')) {
            if ($pwd -eq '') {
              & mysql -h 127.0.0.1 -uroot --protocol=tcp -e $rootSql
            } else {
              & mysql -h 127.0.0.1 -uroot "-p$pwd" --protocol=tcp -e $rootSql
            }
            if ($LASTEXITCODE -eq 0) { $configured = $true; break }
          }
          if (-not $configured) { throw "Failed to configure MySQL root user" }
          $appSql = @"
          CREATE DATABASE IF NOT EXISTS fakefish;
          CREATE USER IF NOT EXISTS 'fakefish'@'localhost' IDENTIFIED BY 'changeme';
          CREATE USER IF NOT EXISTS 'fakefish'@'127.0.0.1' IDENTIFIED BY 'changeme';
          CREATE USER IF NOT EXISTS 'fakefish'@'%' IDENTIFIED BY 'changeme';
          GRANT ALL PRIVILEGES ON fakefish.* TO 'fakefish'@'localhost';
          GRANT ALL PRIVILEGES ON fakefish.* TO 'fakefish'@'127.0.0.1';
          GRANT ALL PRIVILEGES ON fakefish.* TO 'fakefish'@'%';
          FLUSH PRIVILEGES;
          "@
          & mysql -h 127.0.0.1 -uroot -proot --protocol=tcp -e $appSql
          if ($LASTEXITCODE -ne 0) { throw "Failed to create fakefish database/user" }
          Get-Content sql/schema.sql -Raw -Encoding UTF8 |
            & mysql -h 127.0.0.1 -u fakefish -pchangeme --protocol=tcp fakefish
          if ($LASTEXITCODE -ne 0) { throw "schema import failed" }

      - name: Install Redis
        shell: pwsh
        run: |
          $ver = "5.0.14.1"
          $url = "https://github.com/tporadowski/redis/releases/download/v$ver/Redis-x64-$ver.zip"
          $zip = Join-Path $env:RUNNER_TEMP "redis.zip"
          $dest = Join-Path $env:RUNNER_TEMP "redis"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dest

      - name: Start Redis
        shell: pwsh
        run: |
          Start-Process redis-server -ArgumentList "--bind","127.0.0.1","--port","6379","--protected-mode","no" -WindowStyle Hidden
          for ($i = 1; $i -le 30; $i++) {
            $pong = & redis-cli -h 127.0.0.1 ping 2>$null
            if ($pong -match "PONG") { Write-Host "Redis is ready"; exit 0 }
            Start-Sleep -Seconds 1
          }
          throw "Redis did not become ready"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # 继承 Windows PATH：setup-node 装的 node（C:\Program Files\nodejs）以及
          # MySQL/Redis 工具默认不在 MSYS 的 strict PATH 里，否则后续 msys2 shell 步骤
          # 里 `node --check` / `node test_*.js` 全部 127 command not found
          path-type: inherit
          update: true
          install: >-
            git
            make
            ninja
            curl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-sqlite3

      - name: Normalize line endings
        shell: msys2 {0}
        run: |
          # Windows runner 默认 core.autocrlf=true，检出的 CRLF 可能进入 fakelua
          # YAML 解析出的字符串值（如 MySQL 密码尾部多 \r）。强制按 LF 重检。
          git config core.autocrlf false
          git rm -r --cached . >/dev/null
          git reset --hard HEAD

      - name: Check JavaScript syntax
        shell: msys2 {0}
        run: |
          for f in web/*.js test_*.js; do node --check "$f"; done

      # 秒级门禁：双向校验 test_*.js 与 scripts/e2e-*.txt 清单一致，
      # 防止新增用例忘记登记——未登记的用例永远不会在 CI 里被执行。
      - name: Verify E2E suite coverage
        shell: msys2 {0}
        run: bash scripts/check_e2e_coverage.sh

      - name: Cache CPM/ccache
        uses: actions/cache@v4
        with:
          path: .cache
          key: tooling-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            tooling-${{ runner.os }}-

      - name: Resolve fakelua commit
        id: flua
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/esrrhs/fakelua.git "$HOME/flua-src"
          echo "sha=$(git -C "$HOME/flua-src" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore cached fakelua install
        id: cache-flua
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/flua-install
          key: fakelua-${{ runner.os }}-${{ steps.flua.outputs.sha }}

      - name: Build and install fakelua
        if: steps.cache-flua.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -eux
          export CCACHE_DIR="$PWD/.cache/ccache"
          export CPM_SOURCE_CACHE="$PWD/.cache/CPM"
          mkdir -p "$CCACHE_DIR" "$CPM_SOURCE_CACHE"
          ccache --max-size=2G
          cmake -S "$HOME/flua-src" -B "$HOME/flua-src/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/flua-install" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DFAKELUA_TINYCC_GIT_URL=https://github.com/TinyCC/tinycc.git \
            -DFAKELUA_BUILD_TESTS=OFF \
            -DFAKELUA_BUILD_BENCHMARKS=OFF
          cmake --build "$HOME/flua-src/build" --target install --parallel

      - name: Build fakefish
        shell: msys2 {0}
        run: |
          set -eux
          export CCACHE_DIR="$PWD/.cache/ccache"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/flua-install" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel

      - name: Prepare runtime configuration
        shell: msys2 {0}
        run: |
          set -e
          cp config.example.yaml config.yaml
          # 与 Linux job 相同的锚定替换：只改第一处（mysql 段），不能全局替换空密码
          sed -i '0,/user: "root"/s//user: "fakefish"/' config.yaml
          sed -i '0,/password: ""/s//password: "changeme"/' config.yaml
          sed -i 's/bot_count: 3/bot_count: 0/' config.yaml
          sed -i 's/hotfix_token: ""/hotfix_token: "test123"/' config.yaml
          sed -i 's/feast_interval_s: 120/feast_interval_s: 12/' config.yaml
          sed -i 's/zone_shrink_interval_s: 60/zone_shrink_interval_s: 12/' config.yaml
          sed -i 's/zone_hold_s: 30/zone_hold_s: 6/' config.yaml
          # 主阶段是 bot_count=0 的单人世界：关掉一局制，保留旧的「缩圈循环 + 被吃复活」
          # 语义，让 combat/split/zone 这类用例仍在确定性世界里跑（一局制要有人被淘汰
          # 才分得出胜负，放到下面的机器人阶段验证）
          sed -i 's/match_enable: true/match_enable: false/' config.yaml
          npm install

      - name: Run fakefish server & E2E self-test
        shell: msys2 {0}
        env:
          # 与上面的就绪窗口同理：Windows 上 fakelua 按上游约定 -O0 构建且 JIT 走 gcc
          # 子进程，重编译 world(137 函数) + bot(19 函数) 的往返远超 Unix 实测的 6.2-6.8s，
          # 30s 预算在此必然误报 hotfix_result timeout。仅放宽测试基础设施预算，
          # 不改任何判定逻辑。test_hotfix.js 已预留该变量。
          HOTFIX_TIMEOUT_MS: "120000"
          # 同理：Windows 上吃豆发育慢，combat 的 Phase1(默认 15s)/Phase2(默认 30s)
          # 固定预算不够，Hunter 来不及长到 125 就进入追逐、全程停在 grow 模式而超时。
          # test_combat.js 已预留这两个变量，判定逻辑不变。
          COMBAT_PHASE1_MS: "30000"
          COMBAT_PHASE2_MS: "60000"
        run: |
          set -e
          # libfakelua.dll 等运行期依赖在安装前缀的 bin 下
          export PATH="$HOME/flua-install/bin:$PATH"
          # 失败/退出时兜底清掉所有服务器实例（含 Node 测试自起的子实例）
          trap 'taskkill //F //IM fakefish.exe //T 2>/dev/null || true' EXIT

          ./build/fakefish.exe --config=config.yaml > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"

          # Windows 上 fakelua 按上游约定 -O0 构建且 JIT 走 gcc 子进程，就绪窗口放宽到 120s
          READY=0
          for i in $(seq 1 120); do
            if curl -s -f http://127.0.0.1:8080/ > /dev/null 2>&1; then
              echo "Server is ready after $i seconds!"
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "Server failed to start within 120s. Log output:"
            cat server.log
            exit 1
          fi

          # 用例清单见 scripts/e2e-main.txt（三平台共用唯一真源；scripts/check_e2e_coverage.sh 门禁防漏登）
          bash scripts/run_e2e_suite.sh scripts/e2e-main.txt

          # MSYS kill 对原生 Windows 进程不可靠，统一用 taskkill 树杀
          taskkill //F //IM fakefish.exe //T 2>/dev/null || true
          sleep 1
          sed -i 's/bot_count: 0/bot_count: 3/' config.yaml
          # 机器人阶段开回一局制（见上）
          sed -i 's/match_enable: false/match_enable: true/' config.yaml
          # 一局调快（见上）
          sed -i 's/match_duration_s: 90/match_duration_s: 45/' config.yaml
          ./build/fakefish.exe --config=config.yaml > server_bots.log 2>&1 &
          BOT_READY=0
          for i in $(seq 1 120); do
            if curl -s -f http://127.0.0.1:8080/ > /dev/null 2>&1; then
              BOT_READY=1
              break
            fi
            sleep 1
          done
          if [ $BOT_READY -ne 1 ]; then
            echo "Server failed to restart within 120s. Log output:"
            cat server_bots.log
            exit 1
          fi

          # 用例清单见 scripts/e2e-bots.txt（三平台共用唯一真源；scripts/check_e2e_coverage.sh 门禁防漏登）
          bash scripts/run_e2e_suite.sh scripts/e2e-bots.txt


      - name: Dump server log on failure
        if: failure()
        shell: msys2 {0}
        run: |
          if [ -f server.log ]; then
            echo "=== Server Output ==="
            cat server.log
          fi
          if [ -f server_bots.log ]; then
            echo "=== Bots-phase Server Output ==="
            cat server_bots.log
          fi
          if [ -f persist_child.log ]; then
            echo "=== Persistence Child Server Output ==="
            cat persist_child.log
          fi
