name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fakefish
          MYSQL_USER: fakefish
          MYSQL_PASSWORD: changeme
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout fakefish
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for f in web/*.js test_*.js; do node --check "$f"; done

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-fakefish
          max-size: 2G

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libssl-dev libevent-dev libhiredis-dev default-libmysqlclient-dev default-mysql-client

      - name: Initialize MySQL database schema
        run: |
          mysql -h 127.0.0.1 -u fakefish -pchangeme fakefish < sql/schema.sql

      - name: Resolve fakelua commit
        id: flua
        run: |
          git clone --depth 1 https://github.com/esrrhs/fakelua.git "$HOME/flua-src"
          echo "sha=$(git -C "$HOME/flua-src" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore cached fakelua install
        id: cache-flua
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/flua-install
          key: fakelua-${{ runner.os }}-${{ steps.flua.outputs.sha }}

      - name: Build and install fakelua
        if: steps.cache-flua.outputs.cache-hit != 'true'
        run: |
          cmake -S "$HOME/flua-src" -B "$HOME/flua-src/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/flua-install" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DFAKELUA_BUILD_TESTS=OFF \
            -DFAKELUA_BUILD_BENCHMARKS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "$HOME/flua-src/build" --target install -j$(nproc)

      - name: Export fakelua library path
        run: |
          echo "LD_LIBRARY_PATH=$HOME/flua-install/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Build fakefish
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/flua-install" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)

      - name: Prepare runtime configuration
        run: |
          cp config.example.yaml config.yaml
          # Update config.yaml with CI MySQL credentials.
          # 只替换第一处（mysql 段）：redis 段同样有 password: ""，全局替换会让
          # 无密码的 CI redis service 收到 AUTH 而拒绝连接（GNU sed 0,addr 语法）。
          sed -i '0,/user: "root"/s//user: "fakefish"/' config.yaml
          sed -i '0,/password: ""/s//password: "changeme"/' config.yaml
          # Disable bots for the deterministic client/combat phase (re-enabled before test_bots.js)
          sed -i.bak 's/bot_count: 3/bot_count: 0/' config.yaml && rm -f config.yaml.bak
          # Configure hotfix token used by test_hotfix.js
          sed -i.bak 's/hotfix_token: ""/hotfix_token: "test123"/' config.yaml && rm -f config.yaml.bak
          # Speed up the feast gold-rain cycle so test_feast.js sees one quickly
          sed -i.bak 's/feast_interval_s: 120/feast_interval_s: 12/' config.yaml && rm -f config.yaml.bak
          # Speed up the safe-zone shrink/hold cycle so test_zone.js sees a full cycle
          sed -i.bak 's/zone_shrink_interval_s: 60/zone_shrink_interval_s: 12/' config.yaml && rm -f config.yaml.bak
          sed -i.bak 's/zone_hold_s: 30/zone_hold_s: 6/' config.yaml && rm -f config.yaml.bak
          npm install

      - name: Run fakefish server & E2E self-test
        run: |
          ./build/fakefish --config=config.yaml > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"

          # Wait for HTTP server to become ready
          READY=0
          for i in $(seq 1 90); do
            if curl -s -f http://127.0.0.1:8080/ > /dev/null 2>&1; then
              echo "Server is ready after $i seconds!"
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "Server failed to start within 90s. Log output:"
            cat server.log
            exit 1
          fi

          # Run client communication test
          echo "=== Running WebSocket Client E2E Test ==="
          node test_client.js

          # Run auth/session robustness test (malformed packets, duplicate-session kick)
          echo "=== Running Auth & Session E2E Test ==="
          node test_auth.js

          # Run full combat and eating verification test (bot-free world)
          echo "=== Running Combat E2E Test ==="
          node test_combat.js

          # Run HTTP JSON API test (rank/stats/traversal, rank.csv, events, bot-free world)
          echo "=== Running HTTP API E2E Test ==="
          node test_api.js

          # Run SQLite event ledger test (enter/feast records, /api/events)
          echo "=== Running Ledger E2E Test ==="
          node test_ledger.js

          # Run UTF-8 chat truncation test (character-count limit)
          echo "=== Running Chat UTF-8 E2E Test ==="
          node test_chat_utf8.js

          # Run UDP metrics push test (register/push/unregister on :8092)
          echo "=== Running Metrics UDP E2E Test ==="
          node test_metrics.js

          # Run outbound webhook test (spawns isolated child server + local receiver)
          echo "=== Running Webhook E2E Test ==="
          node test_webhook.js

          # Run Redis ZSET mirror + cross-server chat test (spawns isolated child; SKIP without redis)
          echo "=== Running Redis E2E Test ==="
          node test_redis.js

          # Run in-memory event feed test (container.deque, event bus, hotfix persistence)
          echo "=== Running Feed E2E Test ==="
          node test_feed.js

          # Run protobuf snapshot + serialize/base91 selftest E2E test
          echo "=== Running Protobuf E2E Test ==="
          node test_protobuf.js

          # Run HTTP gzip content-negotiation E2E test
          echo "=== Running HTTP Compression E2E Test ==="
          node test_http_compress.js

          # Run admin API E2E test (process.run whitelist, MOTD io persistence)
          echo "=== Running Admin API E2E Test ==="
          node test_admin.js

          # Run tamper-evident audit chain E2E (sqlite + crypto.sha256; sqlite3 CLI required)
          echo "=== Running Audit Chain E2E Test ==="
          node test_audit.js

          # Run encrypted world backup E2E (compress.zstd + crypto AES-CBC/base64/crc32/uuid)
          echo "=== Running Encrypted Backup E2E Test ==="
          node test_backup.js

          # Run masked config export E2E (json/toml/ini)
          echo "=== Running Config Export E2E Test ==="
          node test_config_export.js

          # Run powerup spawn/pickup test (bot-free world, deterministic chasing)
          echo "=== Running Powerup E2E Test ==="
          node test_powerup.js

          # Run feast gold-rain event test (feast interval sed-ed to 12s)
          echo "=== Running Feast E2E Test ==="
          node test_feast.js

          # Run shrinking safe-zone test (shrink/hold cycle sed-ed to 12s/6s)
          echo "=== Running Zone E2E Test ==="
          node test_zone.js

          # Run split/merge test (bot-free world, default merge cooldown)
          echo "=== Running Split E2E Test ==="
          node test_split.js

          # Run admin ops E2E (health probe, online player list/kick/say/save, audit csv,
          # scheduled backup). Kept after the live-world gameplay cases so its one encrypted
          # backup and two-player connect churn do not perturb the time-sensitive
          # powerup/feast/zone/split sequence on oversubscribed shared runners.
          echo "=== Running Admin Ops E2E Test ==="
          node test_admin_ops.js

          # Run hotfix test (rewrites server/combat.lua temporarily, restored at end)
          echo "=== Running Hotfix E2E Test ==="
          node test_hotfix.js

          # Kill server, restart with bots enabled for the bots/rank test
          kill $SERVER_PID || true
          sleep 1
          sed -i.bak 's/bot_count: 0/bot_count: 3/' config.yaml && rm -f config.yaml.bak
          ./build/fakefish --config=config.yaml > server_bots.log 2>&1 &
          SERVER_PID=$!
          BOT_READY=0
          for i in $(seq 1 60); do
            if curl -s -f http://127.0.0.1:8080/ > /dev/null 2>&1; then
              BOT_READY=1
              break
            fi
            sleep 1
          done
          if [ $BOT_READY -ne 1 ]; then
            echo "Server failed to restart within 60s. Log output:"
            cat server_bots.log
            exit 1
          fi

          # Run bots and persistent rank test
          echo "=== Running Bots & Rank E2E Test ==="
          node test_bots.js

          # Run cross-restart persistence test (spawns its own server instance on 18080/18081)
          echo "=== Running Persistence (restart login) E2E Test ==="
          node test_persist.js

          # Kill server
          kill $SERVER_PID || true

      - name: Dump server log on failure
        if: failure()
        run: |
          if [ -f server.log ]; then
            echo "=== Server Output ==="
            cat server.log
          fi
          if [ -f server_bots.log ]; then
            echo "=== Bots-phase Server Output ==="
            cat server_bots.log
          fi
          if [ -f persist_child.log ]; then
            echo "=== Persistence Child Server Output ==="
            cat persist_child.log
          fi

  test-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
