name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fakefish
          MYSQL_USER: fakefish
          MYSQL_PASSWORD: changeme
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout fakefish
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-fakefish
          max-size: 2G

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libssl-dev libevent-dev libhiredis-dev default-libmysqlclient-dev default-mysql-client

      - name: Initialize MySQL database schema
        run: |
          mysql -h 127.0.0.1 -u fakefish -pchangeme fakefish < sql/schema.sql

      - name: Clone and Install fakelua
        run: |
          git clone --depth 1 https://github.com/esrrhs/fakelua.git /tmp/fakelua
          cmake -S /tmp/fakelua -B /tmp/fakelua/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DFAKELUA_BUILD_TESTS=OFF \
            -DFAKELUA_BUILD_BENCHMARKS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          sudo cmake --build /tmp/fakelua/build --target install -j$(nproc)
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/fakelua.conf
          sudo ldconfig
          echo "LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Build fakefish
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)

      - name: Prepare runtime configuration
        run: |
          cp config.example.yaml config.yaml
          # Update config.yaml with CI MySQL credentials
          sed -i 's/user: "root"/user: "fakefish"/' config.yaml
          sed -i 's/password: ""/password: "changeme"/' config.yaml
          # Disable bots for the deterministic client/combat phase (re-enabled before test_bots.js)
          sed -i.bak 's/bot_count: 3/bot_count: 0/' config.yaml && rm -f config.yaml.bak
          # Configure hotfix token used by test_hotfix.js
          sed -i.bak 's/hotfix_token: ""/hotfix_token: "test123"/' config.yaml && rm -f config.yaml.bak
          # Speed up the feast gold-rain cycle so test_feast.js sees one quickly
          sed -i.bak 's/feast_interval_s: 120/feast_interval_s: 12/' config.yaml && rm -f config.yaml.bak
          # Speed up the safe-zone shrink/hold cycle so test_zone.js sees a full cycle
          sed -i.bak 's/zone_shrink_interval_s: 60/zone_shrink_interval_s: 12/' config.yaml && rm -f config.yaml.bak
          sed -i.bak 's/zone_hold_s: 30/zone_hold_s: 6/' config.yaml && rm -f config.yaml.bak
          npm install

      - name: Run fakefish server & E2E self-test
        run: |
          ./build/fakefish --config=config.yaml > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"

          # Wait for HTTP server to become ready
          READY=0
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:8080/ > /dev/null 2>&1; then
              echo "Server is ready after $i seconds!"
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "Server failed to start within 30s. Log output:"
            cat server.log
            exit 1
          fi

          # Run client communication test
          echo "=== Running WebSocket Client E2E Test ==="
          node test_client.js

          # Run full combat and eating verification test (bot-free world)
          echo "=== Running Combat E2E Test ==="
          node test_combat.js

          # Run HTTP JSON API test (rank/stats/traversal, bot-free world)
          echo "=== Running HTTP API E2E Test ==="
          node test_api.js

          # Run powerup spawn/pickup test (bot-free world, deterministic chasing)
          echo "=== Running Powerup E2E Test ==="
          node test_powerup.js

          # Run feast gold-rain event test (feast interval sed-ed to 12s)
          echo "=== Running Feast E2E Test ==="
          node test_feast.js

          # Run shrinking safe-zone test (shrink/hold cycle sed-ed to 12s/6s)
          echo "=== Running Zone E2E Test ==="
          node test_zone.js

          # Run split/merge test (bot-free world, default merge cooldown)
          echo "=== Running Split E2E Test ==="
          node test_split.js

          # Run hotfix test (rewrites server/combat.lua temporarily, restored at end)
          echo "=== Running Hotfix E2E Test ==="
          node test_hotfix.js

          # Kill server, restart with bots enabled for the bots/rank test
          kill $SERVER_PID || true
          sleep 1
          sed -i.bak 's/bot_count: 0/bot_count: 3/' config.yaml && rm -f config.yaml.bak
          ./build/fakefish --config=config.yaml > server_bots.log 2>&1 &
          SERVER_PID=$!
          BOT_READY=0
          for i in $(seq 1 60); do
            if curl -s -f http://127.0.0.1:8080/ > /dev/null 2>&1; then
              BOT_READY=1
              break
            fi
            sleep 1
          done
          if [ $BOT_READY -ne 1 ]; then
            echo "Server failed to restart within 60s. Log output:"
            cat server_bots.log
            exit 1
          fi

          # Run bots and persistent rank test
          echo "=== Running Bots & Rank E2E Test ==="
          node test_bots.js

          # Kill server
          kill $SERVER_PID || true

      - name: Dump server log on failure
        if: failure()
        run: |
          if [ -f server.log ]; then
            echo "=== Server Output ==="
            cat server.log
          fi
          if [ -f server_bots.log ]; then
            echo "=== Bots-phase Server Output ==="
            cat server_bots.log
          fi

  test-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout fakefish
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-fakefish
