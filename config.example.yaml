server:
  http_port: 8080          # 静态前端服务端口
  ws_port: 8081            # 游戏 WebSocket 服务端口
  tick_ms: 50              # 逻辑帧间隔 (50ms ~ 20Hz)
  web_dir: "web"           # 静态页面资源目录

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: ""
  db: "fakefish"
  pool_size: 2
  heartbeat_ms: 5000

game:
  map_width: 2000          # 地图宽度
  map_height: 2000         # 地图高度
  initial_gold: 100        # 初始/复活金币
  move_speed: 160          # 移动速度（像素/秒）
  radius_base: 15          # 基础半径
  radius_k: 2.5            # 半径系数：r = base + k * sqrt(gold)
  eat_ratio: 1.05          # 吞噬阈值：大球半径 >= 小球半径 * ratio
  bot_count: 3             # AI 机器人数量（0 关闭）
  bot_max_gold: 2000       # 机器人金币软上限，达到后只游荡不再主动觅食/猎杀
  conn_timeout_s: 15       # 心跳超时秒数，超时无任何消息的连接将被踢下线
  powerup_count: 5         # 地图道具数量（0 关闭）：加速/护盾/磁铁轮转生成
  fx_speed_s: 6            # 加速效果持续秒数（x1.5 移速）
  fx_shield_s: 5           # 护盾效果持续秒数（免疫吞噬）
  fx_magnet_s: 8           # 磁铁效果持续秒数（金币豆拾取半径 x4）
