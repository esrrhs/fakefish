server:
  http_port: 8080          # 静态前端服务端口
  ws_port: 8081            # 游戏 WebSocket 端口
  tick_ms: 50              # 逻辑帧间隔 (50ms ~ 20Hz)
  web_dir: "web"           # 静态页面资源目录
  hotfix_token: ""         # 热更鉴权 token：留空则拒绝一切热更请求
  hotfix_watch: false      # true 时每秒检查可热更脚本文件变更并自动热更

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: ""
  db: "fakefish"
  pool_size: 2
  heartbeat_ms: 5000

# SQLite 事件流水账本（进场/完全击杀/金币雨；HTTP /api/events 查询）
ledger:
  enabled: true
  path: "data/events.db"   # sqlite 文件路径（父目录自动创建）

# 可选 Redis：跨服全局排行 ZSET 镜像 + 跨服世界聊天（LPUSH/LRANGE 拉模式）
# 不配置 host 或 enabled:false 时静默降级（全局榜回退本服榜）
redis:
  enabled: false
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 0
  timeout_ms: 3000

# 出站事件 Webhook：把完全击杀/金币雨异步 POST 到该 URL；留空 url 关闭
webhook:
  url: ""
  timeout_ms: 3000
  events: ["kill"]         # 可选 "kill"、"feast"

# UDP 指标推送口：采集器先发任意 UDP 包登记为 peer，服务端周期推送 JSON 指标
metrics:
  enabled: true
  ip: "127.0.0.1"
  port: 8092
  interval_s: 5

# 内存事件 feed：fakelua 原生 container.deque 有界环形缓冲（最近进场/击杀/金币雨），
# GET /api/feed 查询；deque 为 NativeObject，脚本热更后内容不丢
feed:
  enabled: true
  capacity: 50            # 保留条数（1-200）

# 登录公告（MOTD）：启动读 data/motd.txt，随 login_ok 下发；GET /api/motd 可匿名查询，
# POST /api/admin/motd（hotfix_token 鉴权）更新，长度按 UTF-8 字符计
motd:
  enabled: true
  path: "data/motd.txt"
  max_len: 200

# 管理接口（hotfix_token 鉴权）：POST /api/admin/run 执行【配置白名单】子进程。
# process.run 不走 shell、参数完全来自下表（客户端不能附加），同步执行并带超时；
# 仅适合秒级运维命令。未配置 token 或 enabled:false 时管理接口一律拒绝。
admin:
  enabled: true
  run_timeout_ms: 3000    # 单命令超时（上限 10000ms），超时杀进程并返回 exit=9
  commands:
    ping: ["echo", "fakefish-pong"]

# 管理操作防篡改审计链（fakelua sqlite + crypto.sha256）：
# 记录 admin 命令/公告/备份/热更，每条 hash 链接前一条；
# GET /api/audit?token= 查询，GET /api/audit/verify?token= 重放校验，任何外部改动都能检出
audit:
  enabled: true
  path: "data/audit.db"

# 加密世界备份（fakelua compress.zstd + crypto AES-CBC/base64/crc32/uuid）：
# POST /api/admin/backup  {"token":"...","action":"create|list|inspect|restore|delete|status|schedule","id":"...","interval_s":N}
# 备份文件不含明文（zstd 后 AES 加密再 base64），篡改一个字节即被 CRC32/解密阶段检出。
# aes_key 必须为 16 字符（fakelua crypto 绑定当前仅开放 AES-128-CBC）；生产环境务必更换
backup:
  enabled: true
  dir: "data/backups"
  aes_key: "0123456789abcdef"
  keep: 10                # 自动保留份数（1-50），超出删最旧
  interval_s: 0           # 定时自动备份周期秒（0=关闭，建议 3600；1..86400，可经管理口动态调整）

# 文件日志（fakelua log 模块）：后台审计/备份事件同步写文件，
# GET /api/admin/logs?token=...&lines=100 读取尾部（最多 64KB/500 行）
log:
  enabled: true
  path: "data/logs/server.log"
  level: "info"           # trace / debug / info / warn / error

game:
  map_width: 2000          # 地图宽度
  map_height: 2000         # 地图高度
  initial_gold: 100        # 初始/复活金币
  move_speed: 160          # 移动速度（像素/秒）
  radius_base: 15          # 基础半径
  radius_k: 2.5            # 半径系数：r = base + k * sqrt(gold)
  eat_ratio: 1.05          # 吞噬阈值：大球半径 >= 小球半径 * ratio
  eat_tie_equal: true      # 同金币兜底：双方金币相等（常见于都被毒圈扣到 0）时按 player_id
                          # 小的一方吞噬，避免半径同为下限时 check_eat 恒不成立而互相卡死；
                          # 置 false 恢复严格「必须严格更大」规则
  bot_count: 3             # AI 机器人数量（0 关闭）
  bot_max_gold: 2000       # 机器人金币软上限，达到后只游荡不再主动觅食/猎杀
  conn_timeout_s: 15       # 心跳超时秒数，超时无任何消息的连接将被踢下线
  save_interval_s: 20      # 在线玩家金币周期落盘秒数（异常退出时的损失窗口），0 关闭
  powerup_count: 5         # 地图道具数量（0 关闭）：加速/护盾/磁铁轮转生成
  fx_speed_s: 6            # 加速效果持续秒数（x1.5 移速）
  fx_shield_s: 5           # 护盾效果持续秒数（免疫吞噬）
  fx_magnet_s: 8           # 磁铁效果持续秒数（金币豆拾取半径 x4）
  feast_interval_s: 120    # 金币雨间隔秒数（timer 心跳驱动），0 关闭；CI 中会被 sed 调快

  # 动态安全区（收缩毒圈）
  zone_enable: true        # 是否启用安全区收缩
  zone_initial_radius: 1500  # 初始安全圈半径（覆盖整张地图）
  zone_min_radius: 250     # 最小圈半径，达到后保持再重置
  zone_shrink_ratio: 0.7   # 每阶段半径乘以此系数
  zone_shrink_interval_s: 60  # 收缩间隔秒数；CI 中会被 sed 调快
  zone_hold_s: 30          # 最小圈保持秒数，之后重置为初始圈；CI 中会被 sed 调快
  zone_dps: 20             # 圈外每秒流失金币

  # 分裂球（空格分裂；细胞冷却后自动合体）
  split_max_cells: 8       # 每名玩家最多细胞数
  split_min_gold: 100      # 细胞金币严格大于此值才能分裂
  split_impulse: 480       # 分裂新细胞初速度（单位/秒）
  split_friction: 3.2      # 分裂冲量衰减系数（越大停得越快）
  merge_cooldown_s: 12     # 分裂后细胞合体冷却秒数

  # 世界聊天
  chat_enable: true        # 是否启用世界聊天
  chat_max_len: 80         # 单条消息最大字符数（按 UTF-8 字符计，非字节）
  chat_history: 20         # 服务端保留的最近消息条数
  chat_cooldown_s: 2       # 同一玩家发消息最小间隔秒数
