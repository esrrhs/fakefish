server:
  http_port: 8080          # 静态前端服务端口
  ws_port: 8081            # 游戏 WebSocket 端口
  tick_ms: 50              # 逻辑帧间隔 (50ms ~ 20Hz)
  web_dir: "web"           # 静态页面资源目录
  hotfix_token: ""         # 热更鉴权 token：留空则拒绝一切热更请求
  hotfix_watch: false      # true 时每秒检查可热更脚本文件变更并自动热更

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: ""
  db: "fakefish"
  pool_size: 2
  heartbeat_ms: 5000

game:
  map_width: 2000          # 地图宽度
  map_height: 2000         # 地图高度
  initial_gold: 100        # 初始/复活金币
  move_speed: 160          # 移动速度（像素/秒）
  radius_base: 15          # 基础半径
  radius_k: 2.5            # 半径系数：r = base + k * sqrt(gold)
  eat_ratio: 1.05          # 吞噬阈值：大球半径 >= 小球半径 * ratio
  eat_tie_equal: true      # 同金币兜底：双方金币相等（常见于都被毒圈扣到 0）时按 player_id
                          # 小的一方吞噬，避免半径同为下限时 check_eat 恒不成立而互相卡死；
                          # 置 false 恢复严格「必须严格更大」规则
  bot_count: 3             # AI 机器人数量（0 关闭）
  bot_max_gold: 2000       # 机器人金币软上限，达到后只游荡不再主动觅食/猎杀
  conn_timeout_s: 15       # 心跳超时秒数，超时无任何消息的连接将被踢下线
  powerup_count: 5         # 地图道具数量（0 关闭）：加速/护盾/磁铁轮转生成
  fx_speed_s: 6            # 加速效果持续秒数（x1.5 移速）
  fx_shield_s: 5           # 护盾效果持续秒数（免疫吞噬）
  fx_magnet_s: 8           # 磁铁效果持续秒数（金币豆拾取半径 x4）
  feast_interval_s: 120    # 金币雨间隔秒数（timer 心跳驱动），0 关闭；CI 中会被 sed 调快

  # 动态安全区（收缩毒圈）
  zone_enable: true        # 是否启用安全区收缩
  zone_initial_radius: 1500  # 初始安全圈半径（覆盖整张地图）
  zone_min_radius: 250     # 最小圈半径，达到后保持再重置
  zone_shrink_ratio: 0.7   # 每阶段半径乘以此系数
  zone_shrink_interval_s: 60  # 收缩间隔秒数；CI 中会被 sed 调快
  zone_hold_s: 30          # 最小圈保持秒数，之后重置为初始圈；CI 中会被 sed 调快
  zone_dps: 20             # 圈外每秒流失金币

  # 分裂球（空格分裂；细胞冷却后自动合体）
  split_max_cells: 8       # 每名玩家最多细胞数
  split_min_gold: 100      # 细胞金币严格大于此值才能分裂
  split_impulse: 480       # 分裂新细胞初速度（单位/秒）
  split_friction: 3.2      # 分裂冲量衰减系数（越大停得越快）
  merge_cooldown_s: 12     # 分裂后细胞合体冷却秒数

  # 世界聊天
  chat_enable: true        # 是否启用世界聊天
  chat_max_len: 80         # 单条消息最大字节数
  chat_history: 20         # 服务端保留的最近消息条数
  chat_cooldown_s: 2       # 同一玩家发消息最小间隔秒数
