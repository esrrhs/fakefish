<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FakeFish - 金币球 · 大鱼吃小鱼</title>
    <link rel="stylesheet" href="style.css?v=20261017">
</head>
<body>
    <div id="game-container">
        <!-- 游戏画布 -->
        <canvas id="game-canvas"></canvas>

        <!-- 顶部 HUD -->
        <div id="hud" class="hidden">
            <div class="hud-card">
                <span class="hud-label">玩家:</span>
                <span id="hud-name" class="hud-val">-</span>
            </div>
            <div class="hud-card">
                <span class="hud-label">金币:</span>
                <span id="hud-gold" class="hud-val gold-text">0</span>
            </div>
            <div class="hud-card">
                <span class="hud-label">体型:</span>
                <span id="hud-radius" class="hud-val">0</span>
            </div>
            <div class="hud-card">
                <span class="hud-label">坐标:</span>
                <span id="hud-pos" class="hud-val">(0, 0)</span>
            </div>
            <div class="hud-card">
                <span class="hud-label">在线人数:</span>
                <span id="hud-online" class="hud-val">0</span>
            </div>
        </div>

        <!-- 排行榜 -->
        <div id="leaderboard" class="hidden">
            <h3>🏆 排行榜</h3>
            <ol id="leaderboard-list"></ol>
            <h4>⭐ 历史最佳</h4>
            <ol id="rank-list"></ol>
        </div>

        <!-- 击杀播报 -->
        <div id="kill-feed" class="hidden"></div>

        <!-- 世界事件公告 -->
        <div id="world-event" class="hidden"></div>

        <!-- 安全区状态 -->
        <div id="zone-hud" class="hidden">
            <div id="zone-hud-title">⚠️ 安全区</div>
            <div id="zone-hud-detail">-</div>
        </div>

        <!-- 圈外危险红雾 -->
        <div id="danger-vignette"></div>

        <!-- 世界聊天 -->
        <div id="chat-box" class="hidden">
            <div id="chat-messages"></div>
            <div id="chat-quick">
                <button class="chat-emote" type="button" data-text="你好 👋">👋</button>
                <button class="chat-emote" type="button" data-text="哈哈 😄">😄</button>
                <button class="chat-emote" type="button" data-text="对不起 🙏">🙏</button>
                <button class="chat-emote" type="button" data-text="干得漂亮 👍">👍</button>
                <button class="chat-emote" type="button" data-text="救命 🆘">🆘</button>
            </div>
            <div id="chat-input-row">
                <input type="text" id="chat-input" maxlength="80" placeholder="Enter 打开 / 发送，Esc 关闭" autocomplete="off">
                <button id="chat-send" type="button">发送</button>
            </div>
        </div>

        <!-- 提示消息通知浮窗 -->
        <div id="notification-box"></div>

        <!-- 进场遮罩：全游客模式，没有账号/密码表单。打开页面即以游客身份进场，
             遮罩只在连接建立前、断线后或服务端拒绝时露出，按钮用于重试。 -->
        <div id="auth-modal" class="modal">
            <div class="modal-content">
                <h1 class="logo-title">🪙 FakeFish 🐟</h1>
                <p class="subtitle">FakeLua 驱动的大鱼吃小鱼实时 PVP 沙盒</p>

                <div id="auth-error" class="error-msg hidden"></div>

                <button id="btn-submit" class="primary-btn">进入竞技场</button>

                <div class="guide-tip">
                    <p>🎮 <strong>操作指南</strong>：方向键 / WASD 移动；或鼠标指向方向移动。</p>
                    <p>⚖️ <strong>规则</strong>：吃掉比自己小的球夺取金币，体型越大移动越稳！</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ?v= 版本参数：前端文件更新时手动递增，强制浏览器拉新（静态站无构建期哈希） -->
    <script src="game.js?v=20261017"></script>
</body>
</html>
